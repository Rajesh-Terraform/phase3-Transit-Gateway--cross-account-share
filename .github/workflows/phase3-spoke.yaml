name: Phase 3 - Spoke TGW Attachment

on:
  push:
    branches:
      - main
    paths:
      - "terraform/modules/**"
      - "terraform/phase3-spoke/**"
      - ".github/workflows/phase3-spoke.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  phase3-spoke:
    name: Attach Spoke VPC to TGW
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      TRANSIT_GATEWAY_ID: ${{ secrets.TRANSIT_GATEWAY_ID }}
      SPOKE_VPC_ID: ${{ secrets.SPOKE_VPC_ID }}
      SPOKE_PRIVATE_SUBNET_1: ${{ secrets.SPOKE_PRIVATE_SUBNET_1 }}
      SPOKE_PRIVATE_SUBNET_2: ${{ secrets.SPOKE_PRIVATE_SUBNET_2 }}
      SPOKE_ROUTE_TABLE_1: ${{ secrets.SPOKE_ROUTE_TABLE_1 }}
      SPOKE_ROUTE_TABLE_2: ${{ secrets.SPOKE_ROUTE_TABLE_2 }}

    defaults:
      run:
        working-directory: terraform/phase3-spoke

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 3. Check AWS identity
      # --------------------------------------------------
      - name: Check AWS identity
        run: |
          echo "AWS Region: $AWS_REGION"
          aws sts get-caller-identity

      # --------------------------------------------------
      # 4. Setup Terraform
      # --------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------
      # 5. Check required variables
      # --------------------------------------------------
      - name: Check required variables
        run: |
          if [ -z "$TRANSIT_GATEWAY_ID" ]; then
            echo "ERROR: TRANSIT_GATEWAY_ID is missing"
            exit 1
          fi

          if [ -z "$SPOKE_VPC_ID" ]; then
            echo "ERROR: SPOKE_VPC_ID is missing"
            exit 1
          fi

          if [ -z "$SPOKE_PRIVATE_SUBNET_1" ]; then
            echo "ERROR: SPOKE_PRIVATE_SUBNET_1 is missing"
            exit 1
          fi

          if [ -z "$SPOKE_PRIVATE_SUBNET_2" ]; then
            echo "ERROR: SPOKE_PRIVATE_SUBNET_2 is missing"
            exit 1
          fi

          if [ -z "$SPOKE_ROUTE_TABLE_1" ]; then
            echo "ERROR: SPOKE_ROUTE_TABLE_1 is missing"
            exit 1
          fi

          if [ -z "$SPOKE_ROUTE_TABLE_2" ]; then
            echo "ERROR: SPOKE_ROUTE_TABLE_2 is missing"
            exit 1
          fi

          echo "All required variables are configured."

      # --------------------------------------------------
      # 6. Create terraform.tfvars
      # --------------------------------------------------
      - name: Create terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          aws_region = "ap-south-1"

          transit_gateway_id = "$TRANSIT_GATEWAY_ID"

          spoke_vpc_id = "$SPOKE_VPC_ID"

          spoke_private_subnet_ids = [
            "$SPOKE_PRIVATE_SUBNET_1",
            "$SPOKE_PRIVATE_SUBNET_2"
          ]

          spoke_route_table_ids = [
            "$SPOKE_ROUTE_TABLE_1",
            "$SPOKE_ROUTE_TABLE_2"
          ]

          hub_vpc_cidr = "10.0.0.0/16"

          spoke_vpc_cidr = "10.1.0.0/16"
          EOF

      # --------------------------------------------------
      # 7. Show terraform.tfvars safely
      # --------------------------------------------------
      - name: Show terraform.tfvars
        run: |
          echo "Terraform variables:"
          sed 's/^transit_gateway_id.*/transit_gateway_id = "***"/' terraform.tfvars

      # --------------------------------------------------
      # 8. Terraform Format
      # --------------------------------------------------
      - name: Terraform Format
        run: terraform fmt -check

      # --------------------------------------------------
      # 9. Terraform Init
      # --------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # --------------------------------------------------
      # 10. Terraform Validate
      # --------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # --------------------------------------------------
      # 11. Terraform Plan
      # --------------------------------------------------
      - name: Terraform Plan
        run: terraform plan \
          -input=false \
          -var-file="terraform.tfvars"

      # --------------------------------------------------
      # 12. Terraform Apply
      # --------------------------------------------------
      - name: Terraform Apply
        run: terraform apply \
          -input=false \
          -auto-approve \
          -var-file="terraform.tfvars"     