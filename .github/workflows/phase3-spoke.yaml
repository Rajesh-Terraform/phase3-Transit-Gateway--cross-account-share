name: Phase 3 - Spoke TGW Attachment

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "terraform/modules/**"
      - "terraform/phase3-spoke/**"
      - ".github/workflows/phase3-spoke.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: true

jobs:

  phase3-spoke:

    name: Attach Spoke VPC to TGW

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/phase3-spoke

    steps:

      # ------------------------------------------------
      # Checkout
      # ------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------
      # Configure AWS
      # ------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy 
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------
      # Check AWS
      # ------------------------------------------------

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------
      # Get TGW ID from GitHub Secret
      # ------------------------------------------------

      - name: Set Transit Gateway ID
        run: |
          if [ -z "${{ secrets.TRANSIT_GATEWAY_ID }}" ]; then
            echo "ERROR: TRANSIT_GATEWAY_ID secret is missing"
            exit 1
          fi

          echo "TRANSIT_GATEWAY_ID=${{ secrets.TRANSIT_GATEWAY_ID }}" >> "$GITHUB_ENV"

      # ------------------------------------------------
      # Validate TGW ID
      # ------------------------------------------------

      - name: Validate Transit Gateway ID
        run: |
          if [ -z "$TRANSIT_GATEWAY_ID" ]; then
            echo "ERROR: TRANSIT_GATEWAY_ID is missing"
            exit 1
          fi

          echo "Transit Gateway ID is configured"

      # ------------------------------------------------
      # Terraform
      # ------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format 
        run: terraform fmt 

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -var-file="terraform.tfvars"
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TRANSIT_GATEWAY_ID }}

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve -var-file="terraform.tfvars"
        env:
          TF_VAR_transit_gateway_id: ${{ secrets.TRANSIT_GATEWAY_ID }}  