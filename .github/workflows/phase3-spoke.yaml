name: Phase 3 - Spoke TGW Attachment

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "terraform/modules/**"
      - "terraform/phase3-spoke/**"
      - ".github/workflows/phase3-spoke.yaml"

permissions:
  id-token: write
  contents: read

jobs:
  phase3-spoke:
    name: Attach Spoke VPC to TGW
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/phase3-spoke

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ap-south-1

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check required variables
        run: |
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "ERROR: AWS_REGION is missing"
            exit 1
          fi

          if [ -z "${{ vars.TRANSIT_GATEWAY_ID }}" ]; then
            echo "ERROR: TRANSIT_GATEWAY_ID is missing"
            exit 1
          fi

          if [ -z "${{ vars.SPOKE_VPC_ID }}" ]; then
            echo "ERROR: SPOKE_VPC_ID is missing"
            exit 1
          fi

          if [ -z "${{ vars.SPOKE_PRIVATE_SUBNET_1 }}" ]; then
            echo "ERROR: SPOKE_PRIVATE_SUBNET_1 is missing"
            exit 1
          fi

          if [ -z "${{ vars.SPOKE_PRIVATE_SUBNET_2 }}" ]; then
            echo "ERROR: SPOKE_PRIVATE_SUBNET_2 is missing"
            exit 1
          fi

          if [ -z "${{ vars.SPOKE_ROUTE_TABLE_1 }}" ]; then
            echo "ERROR: SPOKE_ROUTE_TABLE_1 is missing"
            exit 1
          fi

          if [ -z "${{ vars.SPOKE_ROUTE_TABLE_2 }}" ]; then
            echo "ERROR: SPOKE_ROUTE_TABLE_2 is missing"
            exit 1
          fi

          echo "All required variables are configured."

      - name: Create terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          aws_region = "ap-south-1"

          transit_gateway_id = "${{ vars.TRANSIT_GATEWAY_ID }}"

          spoke_vpc_id = "${{ vars.SPOKE_VPC_ID }}"

          spoke_private_subnet_ids = [
            "${{ vars.SPOKE_PRIVATE_SUBNET_1 }}",
            "${{ vars.SPOKE_PRIVATE_SUBNET_2 }}"
          ]

          spoke_route_table_ids = [
            "${{ vars.SPOKE_ROUTE_TABLE_1 }}",
            "${{ vars.SPOKE_ROUTE_TABLE_2 }}"
          ]

          hub_vpc_cidr = "10.0.0.0/16"

          spoke_vpc_cidr = "10.1.0.0/16"
          EOF

      - name: Show terraform.tfvars
        run: |
          cat terraform.tfvars

      - name: Terraform Format
        run: terraform fmt 

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -var-file="terraform.tfvars"

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve -var-file="terraform.tfvars"    