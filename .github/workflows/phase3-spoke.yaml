name: Phase 3 - Spoke

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "terraform/modules/**"
      - "terraform/phase3/spoke/**"
      - ".github/workflows/phase3-spoke.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform/phase3/spoke

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy 
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init -input=false 

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false   