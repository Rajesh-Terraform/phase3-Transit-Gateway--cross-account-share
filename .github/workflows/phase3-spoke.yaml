name: Phase 3 - Spoke

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  spoke:
    name: Deploy Phase 3 Spoke
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      TF_VAR_aws_region: ap-south-1
      TF_VAR_transit_gateway_id: ${{ secrets.TRANSIT_GATEWAY_ID }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ap-south-1

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      - name: Check Transit Gateway ID
        run: |
          if [ -z "$TF_VAR_transit_gateway_id" ]; then
            echo "ERROR: TRANSIT_GATEWAY_ID GitHub Secret is missing"
            exit 1
          fi

          echo "Transit Gateway ID is configured"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: phase3/spoke
        run: terraform init -input=false

      - name: Terraform Format
        working-directory: phase3/spoke
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: phase3/spoke  
        run: terraform validate

      - name: Terraform Plan
        working-directory: phase3/spoke
        run: |
          terraform plan \
            -input=false \
            -var-file="terraform.tfvars"

      - name: Terraform Apply
        working-directory: phase3/spoke
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -var-file="terraform.tfvars"   