name: Phase 3 - Spoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "phase3/spoke/**"
      - ".github/workflows/phase3-spoke.yml"

permissions:
  id-token: write
  contents: read

jobs:
  spoke:
    name: Deploy Phase 3 Spoke
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      TF_VAR_transit_gateway_id: ${{ secrets.TRANSIT_GATEWAY_ID }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy 
          aws-region: ap-south-1 

      - name: Check Transit Gateway ID
        run: |
          if [ -z "$TF_VAR_transit_gateway_id" ]; then
            echo "ERROR: GitHub Secret TRANSIT_GATEWAY_ID is missing"
            exit 1
          fi

          echo "Transit Gateway ID is configured"

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Terraform Init
        working-directory: phase3/spoke
        run: terraform init

      - name: Terraform Validate
        working-directory: phase3/spoke
        run: terraform validate

      - name: Terraform Plan
        working-directory: phase3/spoke
        run: terraform plan

      - name: Terraform Apply
        working-directory: phase3/spoke
        run: terraform apply -auto-approve   