name: Phase 3 - Spoke Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/phase3-spoke/**"
      - "terraform/modules/**"
      - ".github/workflows/phase3-spoke.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  phase3-spoke:
    name: Phase 3 - Spoke Attachment
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/phase3-spoke

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy
          aws-region: ap-south-1

      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Check Transit Gateway ID
        env:
          TRANSIT_GATEWAY_ID: ${{ vars.TRANSIT_GATEWAY_ID }}
        run: |
          if [ -z "$TRANSIT_GATEWAY_ID" ]; then
            echo "ERROR: TRANSIT_GATEWAY_ID GitHub repository variable is missing"
            exit 1
          fi

          echo "Transit Gateway ID is configured."

      - name: Verify Transit Gateway
        env:
          TRANSIT_GATEWAY_ID: ${{ vars.TRANSIT_GATEWAY_ID }}
        run: |
          aws ec2 describe-transit-gateways \
            --transit-gateway-ids "$TRANSIT_GATEWAY_ID" \
            --region ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Init
        run: |
          terraform init -input=false

      - name: Terraform Validate
        run: |
          terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_transit_gateway_id: ${{ vars.TRANSIT_GATEWAY_ID }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Terraform Apply
        env:
          TF_VAR_transit_gateway_id: ${{ vars.TRANSIT_GATEWAY_ID }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan    