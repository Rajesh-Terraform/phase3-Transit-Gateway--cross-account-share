name: Phase 3 - Spoke TGW Attachment

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "terraform/modules/**"
      - "terraform/phase3-spoke/**"
      - ".github/workflows/phase3-spoke.yaml"

permissions:
  id-token: write
  contents: read

jobs:
  phase3-spoke:
    name: Attach Spoke VPC to TGW
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/phase3-spoke

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::434097521299:role/testingdummy 
          aws-region: ap-south-1

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          aws_region = "${{ vars.AWS_REGION }}"

          transit_gateway_id = "${{ vars.TRANSIT_GATEWAY_ID }}"

          spoke_vpc_id = "${{ vars.SPOKE_VPC_ID }}"

          spoke_private_subnet_ids = [
            "${{ vars.SPOKE_PRIVATE_SUBNET_1 }}",
            "${{ vars.SPOKE_PRIVATE_SUBNET_2 }}"
          ]

          spoke_route_table_ids = [
            "${{ vars.SPOKE_ROUTE_TABLE_1 }}",
            "${{ vars.SPOKE_ROUTE_TABLE_2 }}"
          ]

          hub_vpc_cidr = "10.0.0.0/16"

          spoke_vpc_cidr = "10.1.0.0/16"
          EOF

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve