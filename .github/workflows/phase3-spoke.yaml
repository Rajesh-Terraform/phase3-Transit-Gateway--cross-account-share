name: Phase 3 - Spoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "phase3/spoke/**"
      - ".github/workflows/phase3-spoke.yml"

permissions:
  id-token: write
  contents: read

jobs:
  spoke:
    name: Deploy Phase 3 Spoke
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      TF_VAR_aws_region: ap-south-1
      TF_VAR_transit_gateway_id: ${{ secrets.TRANSIT_GATEWAY_ID }}

    steps:

      # 1. Checkout MAIN branch
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      # 2. Configure AWS OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::SPOKE_ACCOUNT_ID:role/testingdummy
          aws-region: ap-south-1

      # 3. Verify AWS account
      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      # 4. Check TGW ID
      - name: Check Transit Gateway ID
        run: |
          if [ -z "$TF_VAR_transit_gateway_id" ]; then
            echo "ERROR: TRANSIT_GATEWAY_ID GitHub Secret is missing"
            exit 1
          fi

          echo "Transit Gateway ID is configured"

      # 5. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 6. Terraform Init
      - name: Terraform Init
        working-directory: phase3/spoke
        run: |
          terraform init -input=false

      # 7. Terraform Format Check
      - name: Terraform Format
        working-directory: phase3/spoke
        run: |
          terraform fmt -check

      # 8. Terraform Validate
      - name: Terraform Validate
        working-directory: phase3/spoke
        run: |
          terraform validate

      # 9. Terraform Plan
      - name: Terraform Plan
        working-directory: phase3/spoke
        run: |
          terraform plan \
            -input=false \
            -var-file="terraform.tfvars"

      # 10. Terraform Apply
      - name: Terraform Apply
        working-directory: phase3/spoke
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -var-file="terraform.tfvars" 