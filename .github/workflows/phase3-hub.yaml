name: Phase 3 - Hub TGW

on:
  push:
    branches:
      - main
    paths:
      - "terraform/modules/**"
      - "terraform/phase3-hub/**"
      - ".github/workflows/phase3-hub.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  phase3-hub:
    name: Create TGW and RAM Share
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/phase3-hub

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::647132523867:role/github-actions-test-role
          aws-region: ap-south-1

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la

      - name: Terraform Format
        run: terraform fmt 

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -var-file="terraform.tfvars"

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve -var-file="terraform.tfvars"  