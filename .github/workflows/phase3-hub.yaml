name: Phase 3 - Hub Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/phase3-hub/**"
      - "terraform/modules/**"
      - ".github/workflows/phase3-hub.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  phase3-hub:
    name: Phase 3 - Hub
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/phase3-hub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::878962827886:role/Rajesh-devops
          aws-region: ap-south-1

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity
          aws ec2 describe-vpcs --region ap-south-1

      - name: Check Terraform State Bucket
        run: |
          aws s3api head-bucket \
            --bucket rajesh-terraform-state-878962827886

          aws s3 ls \
            s3://rajesh-terraform-state-878962827886

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan          